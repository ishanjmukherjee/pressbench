<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pressbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3efe6;
  --ink: #1c1a17;
  --soft: #8a8478;
  --hair: #d9d3c5;
  --accent: #b5401f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #141311;
    --ink: #ece6d8;
    --soft: #8d877b;
    --hair: #2c2a26;
    --accent: #e8714b;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1080px; margin: 0 auto; padding: 56px 16px 72px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 40px; }
h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 64px; line-height: 1; margin: 0; letter-spacing: -0.01em; }
.day { font-size: 12px; color: var(--soft); letter-spacing: 0.04em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 56px; row-gap: 48px; }
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; row-gap: 40px; }
  h1 { font-size: 48px; }
  main { padding-top: 36px; }
}
.lift { border-top: 1px solid var(--ink); padding-top: 10px; position: relative; }
.lift h2 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.1; margin: 0 0 14px; }
.lift h2 em { font-size: 18px; color: var(--soft); margin-left: 6px; }
.plot { width: 100%; }
svg { display: block; overflow: visible; }
svg text { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; fill: var(--soft); }
.axis { stroke: var(--hair); }
.today { stroke: var(--hair); }
.target-rule { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1 3; }
.target-label { fill: var(--ink); font-weight: 500; }
.path { stroke: var(--soft); stroke-width: 1; fill: none; }
.start { fill: var(--paper); stroke: var(--ink); stroke-width: 1.25; }
.dot { fill: var(--accent); cursor: pointer; }
.callout { fill: var(--ink); font-weight: 500; font-size: 12px; }
.callout-sub { font-size: 10px; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--paper);
  font-size: 11px; padding: 4px 7px; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 10px)); display: none;
}
.error { color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pressbench</h1>
    <span class="day" id="day"></span>
  </header>
  <div class="grid" id="grid"></div>
</main>
<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const H = 230, M = { top: 26, right: 44, bottom: 28, left: 22 };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAY_MS = 86400000;

function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d, 12);
}

function formatDate(d) {
  return `${MONTHS[d.getMonth()]} ${d.getDate()} '${String(d.getFullYear()).slice(2)}`;
}

function fmt(x) {
  return String(Math.round(x * 10) / 10);
}

// Epley-implied load at the lift's target reps.
function impliedLoad(weight, reps, targetReps) {
  return weight * (30 + reps) / (30 + targetReps);
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(",").map(s => s.trim());
  return lines.filter(l => l.trim()).map(line => {
    const cells = line.split(",").map(s => s.trim());
    return Object.fromEntries(header.map((h, i) => [h, cells[i]]));
  });
}

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function draw(lift, points, box, tip) {
  box.textContent = "";
  const W = Math.max(box.clientWidth, 280);
  const t0 = parseDate(lift.start.date), tEnd = parseDate(lift.target.date);
  const t1 = new Date(Math.max(tEnd, ...points.map(p => p.date)));
  const values = [lift.start.value, lift.target.value, ...points.map(p => p.value)];
  const lo = Math.min(...values), hi = Math.max(...values);
  const pad = (hi - lo) * 0.08 || 1;
  const y0 = lo - 2 * pad, y1 = hi + pad;

  const x = d => M.left + (d - t0) / (t1 - t0) * (W - M.left - M.right);
  const y = v => H - M.bottom - (v - y0) / (y1 - y0) * (H - M.top - M.bottom);

  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${lift.name} progress` }, box);
  const base = H - M.bottom;
  el("line", { class: "axis", x1: M.left, x2: W - M.right, y1: base, y2: base }, svg);

  const narrow = W < 420;
  let i = 0;
  for (let d = new Date(t0.getFullYear(), t0.getMonth(), 1, 12); d <= t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1, 12)) {
    if (d < t0) continue;
    if (!narrow || i % 2 === 0) {
      el("line", { class: "axis", x1: x(d), x2: x(d), y1: base, y2: base + 4 }, svg);
      el("text", { x: x(d), y: base + 17, "text-anchor": "middle" }, svg)
        .textContent = `${MONTHS[d.getMonth()]} '${String(d.getFullYear()).slice(2)}`;
    }
    i++;
  }

  const today = new Date();
  if (today > t0 && today < t1) {
    el("line", { class: "today", x1: x(today), x2: x(today), y1: M.top - 8, y2: base }, svg);
  }

  const ty = y(lift.target.value);
  el("line", { class: "target-rule", x1: M.left, x2: W - M.right + 6, y1: ty, y2: ty }, svg);
  el("text", { class: "target-label", x: W - M.right + 10, y: ty + 4 }, svg).textContent = fmt(lift.target.value);

  el("line", { class: "path", x1: x(t0), y1: y(lift.start.value), x2: x(tEnd), y2: ty }, svg);

  // The start counts as the first datapoint when picking which points to label.
  const series = [{ date: t0, value: lift.start.value, start: true }, ...points];
  const latest = series[series.length - 1];
  const best = series.reduce((a, b) => (b.value >= a.value ? b : a));
  const labeled = best === latest ? [latest] : [best, latest];

  el("circle", { class: "start", cx: x(t0), cy: y(lift.start.value), r: 3.5 }, svg);

  for (const p of points) {
    const cx = x(p.date), cy = y(p.value);
    const dot = el("circle", { class: "dot", cx, cy, r: 3 }, svg);
    const text = `${formatDate(p.date)}  ${p.weight} x ${p.reps}  ->  ${fmt(p.value)}`;
    const show = () => {
      tip.textContent = text;
      tip.style.left = `${box.offsetLeft + cx}px`;
      tip.style.top = `${box.offsetTop + cy}px`;
      tip.style.display = "block";
    };
    dot.addEventListener("pointerenter", show);
    dot.addEventListener("click", show);
    dot.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  }

  // Each label tries above its point, then right, then below, then a few fallbacks,
  // and takes the first spot that stays clear of earlier labels and the axis.
  const placed = [];
  const overlaps = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;
  for (const p of labeled) {
    const cx = x(p.date), cy = y(p.value);
    const main = fmt(p.value), sub = p.start ? "" : `${p.weight}x${p.reps}`;
    const w = Math.max(main.length * 7.4, sub.length * 6.2), h = sub ? 24 : 13;
    const spots = [
      { x: cx - w / 2, y: cy - 8 - h },
      { x: cx + 9, y: cy - h / 2 },
      { x: cx - w / 2, y: cy + 9 },
      { x: cx + 9, y: cy + 4 },
      { x: cx - w / 2, y: cy - 8 - h - 28 },
    ].map(s => ({ ...s, x: Math.min(Math.max(s.x, 0), W - M.right - w) }));
    const fits = s => s.y > 0 && s.y + h < base - 2 &&
      !placed.some(b => overlaps(b, { x0: s.x, x1: s.x + w, y0: s.y, y1: s.y + h }));
    const spot = spots.find(fits) || spots[0];
    el("text", { class: "callout", x: spot.x, y: spot.y + 10 }, svg).textContent = main;
    if (sub) el("text", { class: "callout-sub", x: spot.x, y: spot.y + 22 }, svg).textContent = sub;
    placed.push({ x0: spot.x - 2, x1: spot.x + w + 2, y0: spot.y - 2, y1: spot.y + h + 2 });
    placed.push({ x0: cx - 4, x1: cx + 4, y0: cy - 4, y1: cy + 4 });
  }
}

function renderLift(lift, sets, grid) {
  const section = document.createElement("section");
  section.className = "lift";
  section.innerHTML = `<h2></h2><div class="plot"></div><div class="tip"></div>`;
  const h2 = section.querySelector("h2");
  h2.textContent = lift.name;
  const reps = document.createElement("em");
  reps.textContent = `x${lift.reps}`;
  h2.appendChild(reps);
  grid.appendChild(section);

  const points = sets.map(s => {
    const weight = Number(s.weight), reps = Number(s.reps);
    return { date: parseDate(s.date), weight, reps, value: impliedLoad(weight, reps, lift.reps) };
  }).sort((a, b) => a.date - b.date);

  const box = section.querySelector(".plot"), tip = section.querySelector(".tip");
  const redraw = () => draw(lift, points, box, tip);
  redraw();
  new ResizeObserver(redraw).observe(box);
}

async function main() {
  const grid = document.getElementById("grid");
  try {
    const [lifts, csv] = await Promise.all([
      fetch("data/lifts.json", { cache: "no-cache" }).then(r => r.json()),
      fetch("data/sets.csv", { cache: "no-cache" }).then(r => r.text()),
    ]);
    const sets = parseCsv(csv);
    for (const lift of lifts) renderLift(lift, sets.filter(s => s.lift === lift.id), grid);
    if (lifts.length) {
      const start = parseDate(lifts[0].start.date), end = parseDate(lifts[0].target.date);
      const total = Math.round((end - start) / DAY_MS);
      const day = Math.floor((new Date() - start) / DAY_MS) + 1;
      if (day >= 1 && day <= total) document.getElementById("day").textContent = `day ${day} / ${total}`;
    }
  } catch (err) {
    grid.innerHTML = `<p class="error">Could not load data.</p>`;
    console.error(err);
  }
}

main();
</script>
</body>
</html>
