<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PressBench</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #fffff8;
  --ink: #111111;
  --soft: #6f6f68;
  --faint: #b9b9b0;
  --grid: #e6e6da;
  --step: #c4c4ba;
  --accent: #2a9711;
  --accent-text: #23800c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151513;
    --ink: #ecebe4;
    --soft: #9a9990;
    --faint: #5c5b55;
    --grid: #262622;
    --step: #4d4c47;
    --accent: #3dfd1a;
    --accent-text: #3dfd1a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 1100px; margin: 0 auto; padding: 56px 16px 64px; }
header { display: flex; justify-content: space-between; align-items: center; margin: 0 0 40px; }
h1 { font-weight: 600; font-size: 34px; line-height: 1; margin: 0; letter-spacing: -0.02em; }
.links { display: flex; gap: 14px; align-items: center; }
.links a { display: block; color: var(--soft); }
.links a:hover { color: var(--ink); }
.links svg { width: 22px; height: 22px; fill: currentColor; }
.row { position: relative; }
.row + .row { margin-top: 36px; }
.row h2 { font-weight: 500; font-size: 19px; line-height: 1.3; margin: 0 0 2px; letter-spacing: -0.005em; }
.row h2 .unit { display: block; font-weight: 400; font-size: 14px; color: var(--soft); letter-spacing: 0; margin-top: 2px; }
.axis-row { margin-top: 4px !important; }
@media (max-width: 640px) {
  main { padding-top: 36px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 28px; }
  .row + .row { margin-top: 28px; }
}
svg { display: block; overflow: visible; }
svg text { font-family: inherit; font-size: 11px; fill: var(--soft); }
.month { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 3; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.target-line { stroke: var(--ink); stroke-width: 1; }
.y-tick { font-size: 13px; }
.target-value { fill: var(--ink); font-weight: 600; font-size: 13px; }
.plan { stroke: var(--faint); stroke-width: 1; fill: none; }
.target-dot { fill: var(--ink); }
.start { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.start.latest { stroke: var(--accent); stroke-width: 1.6; }
.step { stroke: var(--step); stroke-width: 1; fill: none; }
.step-label { font-size: 10px; fill: var(--soft); }
.dot { fill: var(--ink); }
.dot.latest { fill: var(--accent); }
.value { fill: var(--ink); font-size: 12px; font-weight: 500; }
.value.latest { fill: var(--accent-text); font-weight: 600; }
.today { stroke: var(--accent); stroke-width: 1.5; }
.axis-tick { stroke: var(--faint); }
.error { color: var(--soft); }
</style>
</head>
<body>
<main>
  <header>
    <h1>PressBench</h1>
    <nav class="links">
    <a href="https://github.com/ishanjmukherjee/pressbench" target="_blank" rel="noopener" aria-label="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <a href="https://docs.google.com/spreadsheets/d/1vbwOJGCh1Xv6aR7FNua1aPG77t7kODYGgVRWAD7KpI8" target="_blank" rel="noopener" aria-label="Workout log in Google Sheets">
      <svg viewBox="6 30 180 132" aria-hidden="true">
        <defs>
          <mask id="sheets-axes" maskUnits="userSpaceOnUse" x="0" y="0" width="192" height="192">
            <rect width="192" height="192" fill="#fff"/>
            <path d="M80 121h84m-20 19V76" stroke="#000" stroke-width="12" stroke-linecap="round"/>
          </mask>
        </defs>
        <g transform="rotate(180 96 96)">
          <path opacity=".45" d="M8 74.6c0-8.943 0-13.415 1.404-16.962a20 20 0 0 1 11.234-11.233C24.185 45 28.656 45 37.6 45h60.8c8.943 0 13.415 0 16.962 1.404a20 20 0 0 1 11.234 11.234C128 61.185 128 65.656 128 74.6v42.8c0 8.943 0 13.415-1.404 16.962a20 20 0 0 1-11.234 11.234C111.815 147 107.343 147 98.4 147H37.6c-8.943 0-13.415 0-16.963-1.404a20 20 0 0 1-11.233-11.234C8 130.815 8 126.343 8 117.4z"/>
          <rect x="24" y="32" width="160" height="128" rx="20" mask="url(#sheets-axes)"/>
        </g>
      </svg>
    </a>
    </nav>
  </header>
  <div id="stack"></div>
</main>
<script src="main.js"></script>
</body>
</html>
