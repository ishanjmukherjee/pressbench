<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PressBench</title>
<style>
@font-face {
  font-family: "et-book";
  src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@1.8.0/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff") format("woff");
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "et-book";
  src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@1.8.0/et-book/et-book-bold-line-figures/et-book-bold-line-figures.woff") format("woff");
  font-weight: bold;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "et-book";
  src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@1.8.0/et-book/et-book-display-italic-old-style-figures/et-book-display-italic-old-style-figures.woff") format("woff");
  font-weight: normal;
  font-style: italic;
  font-display: swap;
}
:root {
  --paper: #fffff8;
  --ink: #111111;
  --soft: #6f6f68;
  --faint: #b9b9b0;
  --grid: #e6e6da;
  --step: #c4c4ba;
  --accent: #2a9711;
  --accent-text: #23800c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151513;
    --ink: #ecebe4;
    --soft: #9a9990;
    --faint: #5c5b55;
    --grid: #262622;
    --step: #4d4c47;
    --accent: #3dfd1a;
    --accent-text: #3dfd1a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: et-book, Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
  font-variant-numeric: lining-nums tabular-nums;
}
main { max-width: 1100px; margin: 0 auto; padding: 56px 16px 64px; }
h1 { font-weight: normal; font-size: 44px; line-height: 1; margin: 0 0 40px; letter-spacing: -0.01em; }
.row { display: grid; grid-template-columns: 150px 1fr; column-gap: 0; position: relative; }
.row + .row { margin-top: 36px; }
.label { padding-top: 10px; }
.label h2 { font-weight: normal; font-size: 19px; line-height: 1.2; margin: 0; }
.label .reps { display: block; font-style: italic; color: var(--soft); font-size: 14px; line-height: 1.3; margin-top: 4px; }
.plot { min-width: 0; }
.axis-row { margin-top: 4px !important; }
@media (max-width: 640px) {
  main { padding-top: 36px; }
  h1 { font-size: 36px; margin-bottom: 28px; }
  .row { grid-template-columns: 1fr; }
  .row + .row { margin-top: 26px; }
  .label { padding-top: 0; margin-bottom: 4px; }
  .axis-row .label { display: none; }
}
svg { display: block; overflow: visible; }
svg text { font-family: inherit; font-size: 12px; fill: var(--soft); }
.gridline { stroke: var(--grid); stroke-width: 1; }
.target-line { stroke: var(--ink); stroke-width: 1; }
.target-value { fill: var(--ink); font-weight: bold; }
.plan { stroke: var(--faint); stroke-width: 1; fill: none; }
.target-dot { fill: var(--ink); }
.start { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.start.latest { stroke: var(--accent); stroke-width: 1.6; }
.step { stroke: var(--step); stroke-width: 1; fill: none; }
.step-label { font-size: 11px; font-style: italic; fill: var(--soft); }
.dot { fill: var(--ink); }
.dot.latest { fill: var(--accent); }
.hit { fill: transparent; cursor: pointer; }
.value { fill: var(--ink); font-size: 13px; }
.value.latest { fill: var(--accent-text); font-weight: bold; }
.today { stroke: var(--accent); stroke-width: 1.5; }
.axis-tick { stroke: var(--faint); }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--paper);
  font-size: 13px; padding: 3px 8px; white-space: nowrap; display: none;
  transform: translate(-50%, calc(-100% - 10px));
}
.error { color: var(--soft); font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>PressBench</h1>
  <div id="stack"></div>
</main>
<script>
const SVG_NS = "http://www.w3.org/2000/svg";
const M = { top: 22, right: 36, bottom: 8, left: 44 };
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
// Panel heights aim for a plan line rising at about this angle.
const PLAN_ANGLE = 20 * Math.PI / 180;

function parseDate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d, 12);
}

function yearSuffix(d) {
  return `'${String(d.getFullYear()).slice(2)}`;
}

function formatDate(d) {
  return `${MONTHS[d.getMonth()]} ${d.getDate()} ${yearSuffix(d)}`;
}

function fmt(x) {
  return String(Math.round(x * 10) / 10);
}

// Epley-implied load at the lift's target reps.
function impliedLoad(weight, reps, targetReps) {
  return weight * (30 + reps) / (30 + targetReps);
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.shift().split(",").map(s => s.trim());
  return lines.filter(l => l.trim()).map(line => {
    const cells = line.split(",").map(s => s.trim());
    return Object.fromEntries(header.map((h, i) => [h, cells[i]]));
  });
}

function el(name, attrs, parent) {
  const node = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

function niceStep(span, count) {
  const raw = span / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const f of [1, 2, 2.5, 5, 10]) if (f * mag >= raw) return f * mag;
  return 10 * mag;
}

// Starting from the default spacing, step down through finer nice steps
// (5, 2.5, 2, 1 times a power of ten) until a gridline lands on the target.
function gridStep(span, target) {
  const base = niceStep(span, 4);
  for (let e = Math.ceil(Math.log10(base)); e >= -3; e--) {
    for (const f of [5, 2.5, 2, 1]) {
      const step = f * Math.pow(10, e);
      if (step > base * (1 + 1e-9)) continue;
      const k = target / step;
      if (Math.abs(k - Math.round(k)) < 1e-9) return step;
    }
  }
  return base;
}

const overlaps = (a, b) => a.x0 < b.x1 && b.x0 < a.x1 && a.y0 < b.y1 && b.y0 < a.y1;

// Places text at the first candidate spot clear of the boxes already taken.
function placeText(svg, boxes, text, cls, spots, charW, h, bounds) {
  const w = text.length * charW;
  const cands = spots
    .map(s => ({ x0: Math.max(s.x, bounds.x0), y0: s.y }))
    .map(s => ({ x0: s.x0, x1: s.x0 + w, y0: s.y0, y1: s.y0 + h }))
    .filter(b => b.x1 <= bounds.x1 && b.y0 >= bounds.y0 && b.y1 <= bounds.y1);
  const spot = cands.find(b => !boxes.some(o => overlaps(o, b))) || cands[0];
  if (!spot) return;
  el("text", { class: cls, x: spot.x0, y: spot.y1 - 2 }, svg).textContent = text;
  boxes.push(spot);
}

function drawLift(lift, points, domain, box, tip) {
  box.textContent = "";
  const W = Math.max(box.clientWidth, 260);
  const [t0, t1] = domain;
  const x = d => M.left + (d - t0) / (t1 - t0) * (W - M.left - M.right);

  const ts = parseDate(lift.start.date), tt = parseDate(lift.target.date);
  const values = [lift.start.value, lift.target.value, ...points.map(p => p.value), ...points.map(p => p.weight)];
  const lo = Math.min(...values), hi = Math.max(...values);
  const pad = (hi - lo) * 0.08 || 1;
  // The range snaps outward to whole gridlines, so it starts and ends on one.
  const step = gridStep(hi - lo + 2 * pad, lift.target.value);
  const y0 = Math.floor((lo - pad) / step) * step, y1 = Math.ceil((hi + pad) / step) * step;

  const rise = (lift.target.value - lift.start.value) / (y1 - y0);
  const run = x(tt) - x(ts);
  const plotH = Math.min(240, Math.max(130, run * Math.tan(PLAN_ANGLE) / Math.max(rise, 0.1)));
  const H = M.top + plotH + M.bottom;
  const y = v => M.top + (y1 - v) / (y1 - y0) * plotH;

  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${lift.name} progress` }, box);
  const right = W - M.right;
  const boxes = [];

  for (let v = Math.ceil(y0 / step) * step; v <= y1 + 1e-9; v += step) {
    if (Math.abs(v - lift.target.value) < 1e-9) continue;
    el("line", { class: "gridline", x1: M.left, x2: right, y1: y(v), y2: y(v) }, svg);
    el("text", { x: M.left - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = fmt(v);
  }
  const ty = y(lift.target.value);
  el("line", { class: "target-line", x1: M.left, x2: right, y1: ty, y2: ty }, svg);
  el("text", { class: "target-value", x: M.left - 8, y: ty + 4, "text-anchor": "end" }, svg).textContent = fmt(lift.target.value);
  el("text", { class: "target-value", x: right + 6, y: ty + 4 }, svg).textContent = fmt(lift.target.value);

  el("line", { class: "plan", x1: x(ts), y1: y(lift.start.value), x2: x(tt), y2: ty }, svg);
  el("circle", { class: "target-dot", cx: x(tt), cy: ty, r: 2.2 }, svg);

  const today = new Date();
  today.setHours(12, 0, 0, 0);
  if (today >= ts && today <= tt) {
    const f = (today - ts) / (tt - ts);
    const v = lift.start.value + f * (lift.target.value - lift.start.value);
    el("line", { class: "today", x1: x(today), x2: x(today), y1: y(v) - 5, y2: y(v) + 5 }, svg);
  }

  // The actual weight lifted, as a step line with a number at each change.
  if (points.length) {
    let d = `M${x(points[0].date)},${y(points[0].weight)}`;
    for (let i = 1; i < points.length; i++) {
      d += `H${x(points[i].date)}V${y(points[i].weight)}`;
    }
    el("path", { class: "step", d }, svg);
  }

  const series = [{ date: ts, value: lift.start.value, start: true }, ...points];
  const latest = series[series.length - 1];
  const best = series.reduce((a, b) => (b.value >= a.value ? b : a));

  for (const p of series) {
    const cx = x(p.date), cy = y(p.value);
    boxes.push({ x0: cx - 4, x1: cx + 4, y0: cy - 4, y1: cy + 4 });
  }

  el("circle", { class: "start" + (latest.start ? " latest" : ""), cx: x(ts), cy: y(lift.start.value), r: 3 }, svg);
  for (const p of points) {
    const cx = x(p.date), cy = y(p.value);
    el("circle", { class: "dot" + (p === latest ? " latest" : ""), cx, cy, r: p === latest ? 3.5 : 2.5 }, svg);
    const hit = el("circle", { class: "hit", cx, cy, r: 9 }, svg);
    const text = `${formatDate(p.date)}   ${p.weight} x ${p.reps}   -> ${fmt(p.value)}`;
    const show = () => {
      tip.textContent = text;
      tip.style.left = `${box.offsetLeft + cx}px`;
      tip.style.top = `${box.offsetTop + cy}px`;
      tip.style.display = "block";
    };
    hit.addEventListener("pointerenter", show);
    hit.addEventListener("click", show);
    hit.addEventListener("pointerleave", () => { tip.style.display = "none"; });
  }

  const bounds = { x0: M.left, x1: right, y0: 0, y1: H };
  const label = (p, cls) => {
    const cx = x(p.date), cy = y(p.value), t = fmt(p.value);
    const w = t.length * 7;
    placeText(svg, boxes, t, cls, [
      { x: cx - w / 2, y: cy - 8 - 14 },
      { x: cx + 7, y: cy - 7 },
      { x: cx - w / 2, y: cy + 7 },
      { x: cx - 7 - w, y: cy - 7 },
      { x: cx - w / 2, y: cy - 22 - 14 },
    ], 7, 14, bounds);
  };
  if (best !== latest) label(best, "value");
  label(latest, "value latest");

  let prev = null;
  for (const p of points) {
    if (p.weight === prev) continue;
    prev = p.weight;
    const sx = x(p.date), sy = y(p.weight), t = fmt(p.weight);
    placeText(svg, boxes, t, "step-label", [
      { x: sx + 3, y: sy + 2 },
      { x: sx + 3, y: sy - 14 },
      { x: sx - 3 - t.length * 6, y: sy + 2 },
    ], 6, 12, bounds);
  }
}

function drawAxis(box, domain) {
  box.textContent = "";
  const W = Math.max(box.clientWidth, 260), H = 26;
  const [t0, t1] = domain;
  const x = d => M.left + (d - t0) / (t1 - t0) * (W - M.left - M.right);
  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` }, box);
  const narrow = W < 480;
  let i = 0;
  for (let d = new Date(t0.getFullYear(), t0.getMonth(), 1, 12); d <= t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1, 12)) {
    if (d < t0) continue;
    if (!narrow || i % 2 === 0) {
      el("line", { class: "axis-tick", x1: x(d), x2: x(d), y1: 0, y2: 5 }, svg);
      el("text", { x: x(d), y: 19, "text-anchor": "middle" }, svg).textContent = `${MONTHS[d.getMonth()]} ${yearSuffix(d)}`;
    }
    i++;
  }
}

function makeRow(stack, cls) {
  const row = document.createElement("section");
  row.className = "row" + (cls ? " " + cls : "");
  row.innerHTML = `<div class="label"></div><div class="plot"></div><div class="tip"></div>`;
  stack.appendChild(row);
  return row;
}

async function main() {
  const stack = document.getElementById("stack");
  try {
    const [lifts, csv] = await Promise.all([
      fetch("data/lifts.json", { cache: "no-cache" }).then(r => r.json()),
      fetch("data/sets.csv", { cache: "no-cache" }).then(r => r.text()),
    ]);
    const sets = parseCsv(csv);
    const rows = lifts.map(lift => {
      const points = sets.filter(s => s.lift === lift.id).map(s => {
        const weight = Number(s.weight), reps = Number(s.reps);
        return { date: parseDate(s.date), weight, reps, value: impliedLoad(weight, reps, lift.reps) };
      }).sort((a, b) => a.date - b.date);
      const row = makeRow(stack);
      const h2 = document.createElement("h2");
      h2.textContent = lift.name;
      const reps = document.createElement("span");
      reps.className = "reps";
      reps.textContent = `est. ${lift.reps}-rep load, ${lift.unit}`;
      row.querySelector(".label").append(h2, reps);
      return { lift, points, row };
    });
    const dates = rows.flatMap(r => [parseDate(r.lift.start.date), parseDate(r.lift.target.date), ...r.points.map(p => p.date)]);
    const domain = [new Date(Math.min(...dates)), new Date(Math.max(...dates))];
    const axisRow = makeRow(stack, "axis-row");

    const draw = () => {
      for (const r of rows) drawLift(r.lift, r.points, domain, r.row.querySelector(".plot"), r.row.querySelector(".tip"));
      drawAxis(axisRow.querySelector(".plot"), domain);
    };
    draw();
    let lastWidth = 0;
    new ResizeObserver(() => {
      const w = stack.clientWidth;
      if (w !== lastWidth) { lastWidth = w; draw(); }
    }).observe(stack);
  } catch (err) {
    stack.innerHTML = `<p class="error">Could not load data.</p>`;
    console.error(err);
  }
}

main();
</script>
</body>
</html>
